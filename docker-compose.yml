# Dhara Intake OS — full local stack (doc 10 §2, ADR-014).
# Everything is containerized from S01 so the ECS move at M9 is a config change.
#
#   cp .env.example .env && docker compose up --build
#   open http://localhost:8088/            (runner PWA)
#   open http://localhost:8088/console/login
#   curl http://localhost:8088/api/v1/health
#
# Host ports live in .env and deliberately avoid the common defaults — dev boxes here
# already run other stacks on 8080/5432/6379/3001.

name: dhara-intake-os

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Host-side ports are shifted off the defaults: dev machines usually already run
      # a local Postgres/Redis. Override in .env if you want the standard ones.
      - '${POSTGRES_HOST_PORT:-5442}:5432'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '${REDIS_HOST_PORT:-6389}:6379'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - '${MINIO_HOST_PORT:-9010}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9011}:9001'

  # One-shot bucket bootstrap: audio / documents / exports (doc 04 §1).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        for bucket in "$$S3_BUCKET_AUDIO" "$$S3_BUCKET_DOCUMENTS" "$$S3_BUCKET_EXPORTS"; do
          mc mb --ignore-existing "local/$$bucket"
        done
        echo "minio buckets ready"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS}
      SESSION_SECRET: ${SESSION_SECRET}
      API_PORT: 3001
    expose:
      - '3001'
    ports:
      - '${API_HOST_PORT:-3011}:3001'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_AUDIO: ${S3_BUCKET_AUDIO}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS}
      S3_BUCKET_EXPORTS: ${S3_BUCKET_EXPORTS}
      SESSION_SECRET: ${SESSION_SECRET}

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    expose:
      - '80'

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - runner
      - console
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '${EDGE_HOST_PORT:-8088}:80'

volumes:
  postgres-data:
  redis-data:
  minio-data:
