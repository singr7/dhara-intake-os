# Static host for the runner PWA. The edge proxy (infra/nginx/nginx.conf) fronts this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types predates the webmanifest type; without this the browser
    # gets application/octet-stream and skips the install prompt.
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; the shell and the service worker are not —
    # a stale sw.js would pin phones to an old intake build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
