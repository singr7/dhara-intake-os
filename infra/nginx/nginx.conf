worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Required for WebSocket upgrades (intake step stream now, voice relay from M2).
    # Demo lesson: without this map, WS silently falls back and audio never flows.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api      { server api:3001; }
    upstream console  { server console:3000; }
    upstream runner   { server runner:80; }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            proxy_pass http://api;
            proxy_read_timeout 120s;
        }

        # WebSocket endpoints share the API upstream.
        location /ws/ {
            proxy_pass http://api;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Staff console (Next.js, basePath /console).
        location /console {
            proxy_pass http://console;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Everything else is the patient-facing runner PWA.
        location / {
            proxy_pass http://runner;
        }
    }
}
